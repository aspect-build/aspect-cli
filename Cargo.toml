[workspace]
members = ["crates/*"]
exclude = ["crates/example-tui"]
default-members = ["crates/aspect-cli"]
resolver = "2"

[profile.release]
lto="fat"
codegen-units = 1
opt-level = "z"

[workspace.package]
version = "0.0.0-dev"
categories = ["development-tools"]
homepage = "https://github.com/aspect-build/aspect-cli"
repository = "https://github.com/aspect-build/aspect-cli"
license = "Apache 2"
edition = "2024"
readme = "README.md"
rust-version = "1.88.0"

# Crates `cargo patch-crate` patches from patches/<crate>+<version>.patch into
# target/patch/; .cargo/config.toml points cargo there. Bazel applies the same
# patches through MODULE.bazel. See "Patched crates" in CLAUDE.md.
[workspace.metadata.patch]
crates = ["starlark", "wiggle-macro", "witx"]

# The shipped release settings (`bazel/rust/defs.bzl` and `--config=release`
# in .bazelrc: opt-level 3, one codegen unit, fat LTO, panic=abort) with
# symbols kept, for profiling.
[profile.profiling]
inherits = "release"
opt-level = 3
panic = "abort"
debug = "line-tables-only"
strip = false
