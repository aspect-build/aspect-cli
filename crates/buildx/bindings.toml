    "experimental_strict_repo_env",
    "enable_bzlmod",
    "enable_workspace",
    "incompatible_use_plus_in_repo_names",
    "experimental_enable_aspect_hints",
    "aspects_parameters",
    "workspace_status_command",
    "embed_label",
