# Bazel server classes buildx calls. `build.rs` generates the bindings for
# every version below into OUT_DIR; `blazon --spec bindings.toml --dump a.b.C`
# prints a class's members for writing an entry.

versions = ["9.0.1", "9.2.0"]
starlark = true

