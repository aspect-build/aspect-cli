[options]
fragments = true
include_effect_tags = [
    "LOADING_AND_ANALYSIS",
    "BUILD_FILE_SEMANTICS",
    "AFFECTS_OUTPUTS",
    "ACTION_COMMAND_LINES",
    "CHANGES_INPUTS",
    "LOSES_INCREMENTAL_STATE",
]
exclude_effect_tags = [
    "EXECUTION",
    "NO_OP",
    "TERMINAL_OUTPUT",
    "BAZEL_MONITORING",
    "EAGERNESS_TO_EXIT",
    "HOST_MACHINE_RESOURCE_OPTIMIZATIONS",
    "TEST_RUNNER",
]
include_classes = [
    "com.google.devtools.build.lib.packages.semantics.BuildLanguageOptions",
