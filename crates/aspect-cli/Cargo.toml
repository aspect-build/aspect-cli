[package]
name = "aspect-cli"
version.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
readme.workspace = true
rust-version.workspace = true
default-run = "aspect-cli"


[[bin]]
name = "aspect-cli"
path = "src/main.rs"

[features]
# Set unconditionally by every Bazel-built target (bazel/rust/defs.bzl).
# Builds with this feature always embed the @aspect builtins; without it,
# debug builds load them live from the source tree (src/builtins/mod.rs).
bazel = []

[dependencies]
aspect-telemetry = { path = "../aspect-telemetry" }
axl-runtime = { path = "../axl-runtime" }
clap = {version= "4.5.40", features = ["string"]}
anyhow = "1"
async-trait = "0.1.89"
futures = "0.3.31"
reqwest = { version = "0.12.22", default-features = false, features = ["blocking", "http2", "charset", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
opentelemetry = "0.33.0"
opentelemetry_sdk = "0.33.0"
# No bundled HTTP client: `otlp_http::OtlpHttpClient` supplies the workspace reqwest.
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["grpc-tonic", "tls-roots", "tls-ring", "http-proto", "trace", "logs", "metrics", "internal-logs"] }
opentelemetry-http = { version = "0.33.0", default-features = false }
opentelemetry-appender-tracing = "0.33.0"
opentelemetry-semantic-conventions = "0.33.0"
include_dir = { version = "0.7", features = ["glob"] }
names = { version = "0.14", default-features = false }
uuid = { version = "1", features = ["v4"] }
starlark = "0.14.2"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "rt", "rt-multi-thread", "signal", "time"] }
tonic = "0.14"
tracing = "0.1.41"
tracing-core = "0.1.34"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = "0.3.20"
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6.0.0"
mimalloc = { version = "0.1", default-features = false, features = ["secure"] }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook-registry = "1"
backtrace = "0.3"

[dev-dependencies]
tempfile = "3"
opentelemetry_sdk = { version = "0.33.0", features = ["testing"] }
