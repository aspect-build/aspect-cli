include:
  - component: $CI_SERVER_FQDN/aspect-build/setup-aspect-gitlab-component/setup@2026.38.3
workflow:
  rules:
    # Run for everything except tag pushes
    - if: "$CI_COMMIT_TAG == null"
variables:
  # Mirrored setup: the repo lives on GitHub and is mirrored to GitLab for CI.
  # One URL drives both status-check posting (GithubStatusChecks picks the
  # right owner/repo from it) and status-check rendering (build_metadata
  # derives REPO_URL / REPO_OWNER / REPO_NAME / VCS from it).
  ASPECT_VCS_URL: "https://github.com/aspect-build/aspect-cli"
  # Manual break-glass override for `aspect delivery`. Default empty —
  # appears as an editable field on the "Run pipeline" page so users can
  # force-deliver specific targets without editing the pipeline.
  FORCE_TARGETS:
    value: ""
    description: "Bazel targets to force-deliver (space-separated). Example: //examples/deliverable. Leave empty for normal selective delivery."
stages:
  - CI
# The regular task jobs run on every pipeline EXCEPT a scheduled one. A
# scheduled pipeline exists to run `warming` (at the bottom of this file), which
# clears the runner's Bazel state before rebuilding it — so running the normal
# suite alongside it both doubles the work of every schedule and has those jobs
# racing the state warming is rebuilding. A job with no `rules` runs in
# scheduled pipelines too, so this has to be stated rather than assumed.
.not-scheduled:
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
pre-build:
  stage: CI
  extends: .not-scheduled
  script:
    - echo "Build and upload CLI to remote cache"
    - .aspect/bootstrap.sh
  tags:
    - aspect-workflows
    - aspect-default
build-task:
  stage: CI
  needs: [pre-build]
  extends:
    - .setup-aspect
    - .not-scheduled
  tags:
    - aspect-workflows
    - aspect-default
  script:
    - .aspect/bootstrap.sh
    - ASPECT_DEBUG=1 aspect build --task:name build-gl-debug
    - aspect build --task:name build-gl
test-task:
  stage: CI
  needs: [pre-build]
  extends:
    - .setup-aspect
    - .not-scheduled
  tags:
    - aspect-workflows
    - aspect-default
  script:
    - .aspect/bootstrap.sh
    - ASPECT_DEBUG=1 aspect test --task:name test-gl-debug
    - aspect test --task:name test-gl
lint-task:
  stage: CI
  needs: [pre-build]
  extends:
    - .setup-aspect
    - .not-scheduled
  tags:
    - aspect-workflows
    - aspect-default
  script:
    - .aspect/bootstrap.sh
    - ASPECT_DEBUG=1 aspect lint --task:name lint-gl-debug --fix --aspect=//tools/lint:linters.bzl%shellcheck -- //examples/lint/... -//exclude/...
    # Revert applied --fix edits before next run. Use git restore (tracked
    # mods only) + git clean -fd (untracked non-ignored files); do NOT use
    # -x because that wipes bazel-out/ and target/ — including the
    # pre-built CLI dropped there by .aspect/bootstrap.sh.
    - git restore .
    - git clean -fd
    - aspect lint --task:name lint-gl --fix --aspect=//tools/lint:linters.bzl%shellcheck -- //examples/lint/... -//exclude/...
# Dedicated buildifier-only step that runs in parallel with format-task.
buildifier-task:
  stage: CI
  needs: [pre-build]
  extends:
    - .setup-aspect
    - .not-scheduled
  tags:
    - aspect-workflows
    - aspect-default
  script:
    - .aspect/bootstrap.sh
    - ASPECT_DEBUG=1 aspect buildifier --task:name buildifier-gl-debug
    - aspect buildifier --task:name buildifier-gl
format-task:
  stage: CI
  needs: [pre-build]
  extends:
    - .setup-aspect
    - .not-scheduled
  tags:
    - aspect-workflows
    - aspect-default
  # Starlark patterns are handled by buildifier-task; ignore them here so the
  # two steps don't do duplicate work.
  script:
    - .aspect/bootstrap.sh
    - ASPECT_DEBUG=1 aspect format --task:name format-gl-debug
    - aspect format --task:name format-gl
gazelle-task:
  stage: CI
  needs: [pre-build]
  extends:
    - .setup-aspect
    - .not-scheduled
  tags:
    - aspect-workflows
    - aspect-default
  script:
    - .aspect/bootstrap.sh
    - ASPECT_DEBUG=1 aspect gazelle --task:name gazelle-gl-debug
    - aspect gazelle --task:name gazelle-gl
# Regression test for the build-from-source gazelle path — upstream
# `gazelle()` macro + rules_go toolchain. Most users will adopt the
# prebuilt binary; this job catches breakage on the alternate path.
# `--config=pure_go` is required on Linux: toolchains_llvm_bootstrapped's
# lld can't accept Go's non-PIC relocations on x86_64.
gazelle-from-source-task:
  stage: CI
  needs: [pre-build]
  extends:
    - .setup-aspect
    - .not-scheduled
  tags:
    - aspect-workflows
    - aspect-default
  script:
    - .aspect/bootstrap.sh
    - ASPECT_DEBUG=1 aspect gazelle --gazelle-target=//tools/gazelle:gazelle_from_source --config=pure_go --task:name gazelle-from-source-gl-debug
    - aspect gazelle --gazelle-target=//tools/gazelle:gazelle_from_source --config=pure_go --task:name gazelle-from-source-gl
delivery-task:
  stage: CI
  needs: [pre-build]
  extends:
    - .setup-aspect
    - .not-scheduled
  tags:
    - aspect-workflows
    - aspect-default
  variables:
    ASPECT_WORKFLOWS_DELIVERY_FORCE_TARGETS: $FORCE_TARGETS
  script:
    - .aspect/bootstrap.sh
    # --warn-unresolved-digest: the deliverable set includes py_deliverable, a
    # stamped py_binary whose PyWriteBuildData action is uncacheable and never
    # resolves a digest — a known, tolerated missing digest, so keep it a warning
    # rather than the (new) default hard failure.
    - ASPECT_DEBUG=1 aspect delivery --task:name delivery-gl-debug --warn-unresolved-digest
    - aspect delivery --task:name delivery-gl --warn-unresolved-digest
    # no_remote_exec_deliverable regresses only on the SECOND consecutive run in
    # one output base — its DeliveryHash probe may run locally, and a probe that
    # ran successfully is served from Bazel's local action cache next time, so no
    # lookup and no digest. Run it twice under its own state prefix, without
    # --warn-unresolved-digest so an unresolved digest hard-fails; the second run
    # must SKIP it, proving the digest is stable across runs.
    - aspect delivery --task:name delivery-gl-nre --query //examples/deliverable:no_remote_exec_deliverable
    - aspect delivery --task:name delivery-gl-nre --query //examples/deliverable:no_remote_exec_deliverable
# Pre-populates this repo's Bazel caches on a schedule, so a CI runner starts
# from a warm state instead of refetching every external dependency. Without it
# each run pays a full cold fetch, which is both slow and a single point of
# failure when an upstream download is briefly unavailable.
#
# GitLab only: this is the CI host where the repo has a runner pool of its own,
# so a warmed cache here belongs to this repo alone. Adding the same on the
# other hosts would need pools that are not shared, which is out of scope here.
#
# Schedule-gated because `aspect ci warming` clears the runner's prior Bazel
# state before rebuilding it, so it must not run beside the regular tasks --
# `.not-scheduled` above keeps those out of scheduled pipelines.
#
# Bootstraps first, like every other job here. The released CLI cannot evaluate
# this repo's own .aspect/axl.axl once the builtins reference a symbol it does
# not ship yet, which is the normal state on main between releases; the task
# then fails before it starts. The earlier revision skipped bootstrap on the
# theory that warming's cleanup would discard the freshly built CLI -- it does
# not: `aspect` resolves through local("target/ci/aspect-cli")
# (.aspect/version.axl), and by the time the cleanup runs it is already the
# running process.
#
# Does nothing until a pipeline schedule is configured; with none, the job is
# never created.
warming:
  stage: CI
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  extends: .setup-aspect
  tags:
    - aspect-workflows
    - aspect-default
  script:
    - .aspect/bootstrap.sh
    - aspect ci warming --task:name warming -- //... -//exclude/...
