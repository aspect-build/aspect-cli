name: Build Release Artifacts
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout and build'
        required: false
        type: string
        default: ''
    outputs:
      linux:
        description: "Linux and MacOS binaries"
        value: ${{jobs.build.outputs.artifact}}
permissions:
  id-token: write
  attestations: write
  contents: write
jobs:
  build:
    name: Build MacOS and Linux release artifacts
    # Only reachable via workflow_dispatch and the release workflows, never from
    # a fork PR, so no GitHub-hosted fallback is needed.
    runs-on: [self-hosted, aspect-workflows, aspect-large]
    timeout-minutes: 120
    outputs:
      artifact: ${{steps.upload.outputs.artifact-url}}
    env:
      # Eject from this repo's tools/bazel wrapper. The wrapper routes
      # `bazel build|test|run` through `aspect`, but the release build IS
      # the aspect binary — using aspect to build itself defeats the
      # `bazel`-only bootstrap (and would fail outright on a clean
      # runner where aspect isn't installed yet).
      ASPECT_WRAPPER_SKIP: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0 # need to see tags (https://github.com/actions/checkout?tab=readme-ov-file#fetch-all-history-for-all-tags-and-branches)
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_OSS_API_TOKEN }}
          disk-cache: ${{ github.workflow }}
          repository-cache: ${{ github.workflow }}
      - name: Build release artifacts
        # `release.sh` (genrule output of //bazel/release:release.bzl) cps
        # bazel-out paths directly without declaring the binaries / .sha256
        # files as runfiles. The :ci default `--remote_download_outputs=minimal`
        # leaves cache-hit outputs (notably the unstamped axl-docgen `hashes`
        # actions) remote-only, so the cp step then fails with "cannot stat".
        #
        # Pre-build the release targets' outputs (the binaries + sha256
        # files, plus the launcher's Homebrew `brew.rb` formula and bottles)
        # with `toplevel` so they land on local disk first; the subsequent
        # `bazel run :release` cps from those already-materialized paths and
        # doesn't need a broader download policy. `:brew` is part of the
        # launcher `:release` graph but is NOT under `:bins`, so it must be
        # listed explicitly — otherwise a remote cache hit leaves `brew.rb`
        # remote-only and the cp fails with "cannot stat". Same reasoning for
        # aspect-cli's `:debug_bins`, which `:release` copies but which is not
        # reachable from `:bins`.
        #
        # The assets are written under $RUNNER_TEMP, outside the checkout,
        # on purpose. `--config=release` stamps with bazel/workspace_status.sh,
        # whose STABLE_BUILD_SCM_LOCAL_CHANGES key runs `git status`. Copying
        # into the checkout leaves untracked files, so from the second
        # `bazel run :release` on the key flips clean -> dirty, the
        # stable-status file changes, and every stamped rustc action (all
        # first-party crates, via bazel/rust/defs.bzl) is rebuilt from
        # scratch: ~13 minutes of the job, and binaries stamped as a dirty
        # build. Outside the checkout the tree stays clean and those runs
        # are pure cache hits.
        run: |
          mkdir -p "${RUNNER_TEMP}/upload_root/assets"
          bazel build --config=release --config=ci --remote_download_outputs=toplevel \
            //crates/aspect-launcher:bins \
            //crates/aspect-launcher:brew \
            //crates/aspect-cli:bins \
            //crates/aspect-cli:debug_bins \
            //crates/axl-docgen:bins
          bazel run --config=release --config=ci //crates/aspect-launcher:release -- "${RUNNER_TEMP}/upload_root/assets"
          bazel run --config=release --config=ci //crates/aspect-cli:release -- "${RUNNER_TEMP}/upload_root/assets"
          bazel run --config=release --config=ci //crates/axl-docgen:release -- "${RUNNER_TEMP}/upload_root/assets"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "${{ runner.temp }}/upload_root/assets/*"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          # The artifact root is the common ancestor of the matched files, so
          # this still uploads `assets/...` exactly as before.
          path: ${{ runner.temp }}/upload_root/
          retention-days: 1
