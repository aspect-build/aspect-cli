name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` so adding ci:workflows-runners starts a run; see
    # dispatch-workflows-runners.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
permissions:
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
# The Dash0 OTLP endpoint and bearer token feed `.aspect/config.axl`'s `ctx.telemetry.exporters.add(...)`
# call, which dogfoods the trace.event/trace.log pipeline against a real backend.
# Both are no-ops if a secret isn't configured (unset env var = empty string,
# config.axl skips registration).
#
# ASPECT_HAS_API_TOKEN carries only whether the secret exists — "true" or
# "false", never the value. That is all .aspect/config.axl needs to tell a
# logged-in run from a fork PR (which gets no secrets) before defaulting
# `--remote` to Aspect Cloud. The token itself stays out of the job env on
# purpose: setup-aspect pipes it straight into `aspect auth login
# --with-api-token` and leaves only the short-lived JWT on disk, and an
# ASPECT_API_TOKEN in the environment would override that stored credential
# on every invocation.
env:
  DASH0_ENDPOINT: ${{ secrets.DASH0_ENDPOINT }}
  DASH0_TOKEN: ${{ secrets.DASH0_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ASPECT_HAS_API_TOKEN: ${{ secrets.ASPECT_CLOUD_API_TOKEN != '' }}
jobs:
  # Pure-bash unit tests for the tools/bazel wrapper. No aspect, no bazel, no
  # pre-build — runs on a stock ephemeral runner in seconds and guards the
  # wrapper's routing/flag-classification logic against regressions.
  wrapper-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: tools/bazel wrapper tests
        run: ./tools/wrapper-test.sh
  pre-build:
    runs-on: ubuntu-latest
    # A cold Rust/LLVM build plus remote-cache downloads can exceed 30 minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      # The stable launcher installed here only authenticates bootstrap.sh's
      # Aspect Cloud cache; the CLI under test is the one bootstrap.sh builds.
      # A released CLI cannot load this commit's .aspect config, so the login
      # and the rc generation that setup-aspect would run in the checkout are
      # skipped, and the login runs outside it instead.
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          bazelrc-generate: false
          disk-cache: true
      - name: Log in to Aspect Cloud
        if: env.ASPECT_HAS_API_TOKEN == 'true'
        working-directory: ${{ runner.temp }}
        env:
          TOKEN: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
        run: printf '%s' "$TOKEN" | aspect auth login --with-api-token
      - name: Pre-build CLI
        run: |
          echo "Build and upload CLI to remote cache"
          .aspect/bootstrap.sh
      # Surface the just-built binary to the jobs below rather than rebuilding
      # it from source in each one.
      - name: Upload aspect-cli binary
        uses: actions/upload-artifact@v7
        with:
          name: aspect-cli
          path: target/ci/aspect-cli
          retention-days: 1
          if-no-files-found: error
  # Kick off ci-workflows-runners.yaml as its OWN workflow run, immediately
  # after pre-build. We dispatch via the API (rather than a reusable
  # `uses:` call) on purpose: a reusable workflow nests its jobs inside this
  # run, whereas a dispatch produces a separate workflow run in the GitHub UI.
  # That separation is the point — it gives the Aspect PR-summary comment a
  # genuine cross-workflow case to merge tasks from.
  #
  # We dispatch on the PR head ref (or branch for push) so the dispatched run
  # executes *this* commit's runner workflow, and we hand it `prebuild_run_id`
  # so its jobs reuse the binary pre-build just uploaded instead of rebuilding
  # from source.
  #
  # A workflow_dispatch run carries NO PR context (event_name is
  # workflow_dispatch, not pull_request) — so without help the runner run is
  # orphaned: it shows no status check on the PR and the Aspect PR-summary
  # comment can't merge its tasks. We pass the triggering PR's number and head
  # SHA through so the runner run can reconstruct that context:
  #   pr_number -> ASPECT_GITHUB_PR_NUMBER (github.axl detect_pr override)
  #   head_sha  -> GITHUB_SHA              (so the check-run attaches to the PR
  #                                         head commit, not the merge commit)
  # On push (no PR) both resolve to empty and the run behaves as a branch run.
  #
  # Its jobs run on self-hosted Aspect Workflows runners, so it is opt-in:
  # workflow_dispatch, or a PR carrying the ci:workflows-runners label.
  dispatch-workflows-runners:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:workflows-runners')
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 5
    permissions:
      actions: write # required to dispatch another workflow
      contents: read
    steps:
      - name: Dispatch CI - Workflows Runners
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh workflow run ci-workflows-runners.yaml \
            --repo "${{ github.repository }}" \
            --ref "$REF" \
            --field "force_targets=" \
            --field "prebuild_run_id=${{ github.run_id }}" \
            --field "pr_number=${PR_NUMBER}" \
            --field "head_sha=${HEAD_SHA}"
  # Dedicated buildifier-only step that runs in parallel with format-task.
  # Models the legacy Rosetta `buildifier` task using a Starlark-only
  # `format_multirun` target — see https://aspect.build/docs/cli/migration/buildifier.
  buildifier-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # install-prebuilt-aspect-cli only downloads an artifact and puts a
      # binary on PATH — it doesn't need any environment setup, so it can
      # run before setup-aspect. That order also lets setup-aspect's
      # built-in `aspect auth login` find the prebuilt `aspect` on PATH.
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Buildifier Task
        run: aspect buildifier --task:name buildifier-gha
  buildifier-debug-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Buildifier Task (ASPECT_DEBUG=1)
        run: ASPECT_DEBUG=1 aspect buildifier --task:name buildifier-gha-debug
  format-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Format Task
        run: bazel format --task:name format-gha
  format-debug-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Format Task (ASPECT_DEBUG=1)
        run: ASPECT_DEBUG=1 bazel format --task:name format-gha-debug
  format-repeat-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      # Test repeat tasks without --task:name flags
      - name: Format Task
        run: bazel format
      - name: Format Task 2
        run: bazel format
      - name: Format Task 3
        run: bazel format
      - name: Format Task 4
        run: bazel format
  gazelle-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Gazelle Task
        run: aspect gazelle --task:name gazelle-gha
  gazelle-debug-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Gazelle Task (ASPECT_DEBUG=1)
        run: ASPECT_DEBUG=1 aspect gazelle --task:name gazelle-gha-debug
  gazelle-from-source-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      # Regression test for the build-from-source gazelle path —
      # upstream `gazelle()` macro + rules_go toolchain compiling a
      # bespoke gazelle binary, instead of the prebuilt artifact.
      # `--config=pure_go` is required on Linux: toolchains_llvm_bootstrapped's
      # lld can't accept Go's non-PIC relocations on x86_64.
      - name: Gazelle Task — from-source
        run: aspect gazelle --gazelle-target=//tools/gazelle:gazelle_from_source --config=pure_go --task:name gazelle-from-source-gha
  gazelle-from-source-debug-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Gazelle Task — from-source (ASPECT_DEBUG=1)
        run: ASPECT_DEBUG=1 aspect gazelle --gazelle-target=//tools/gazelle:gazelle_from_source --config=pure_go --task:name gazelle-from-source-gha-debug
  lint-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Lint Task
        run: aspect lint --task:name lint-gha
  lint-debug-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Lint Task (ASPECT_DEBUG=1)
        run: ASPECT_DEBUG=1 aspect lint --task:name lint-gha-debug
  build-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Build Task
        run: bazel build --task:name build-gha
  test-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Test Task
        run: aspect test --task:name test-gha
  # Render each template preset with the freshly-built `aspect init` and build
  # the generated workspace. Catches CLI-side breakage of the init renderer
  # against the live template. `--template-ref=main` tests the current template
  # tip; `init`'s default (latest release) is what end users get.
  #
  # Every preset is scaffolded on PRs (cheap, exercises the renderer for all of
  # them), but the slow workspace build runs only for `shell` — the fastest
  # preset and enough to smoke-test the generated build. Pushes to main build
  # every preset.
  init-preset:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset:
          - minimal
          - shell
          - go
          - js
          - py
          - java
          - kotlin
          - cpp
          - rust
          - ruby
          - scala
          - kitchen-sink
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - uses: ./.github/actions/regenerate-machine-bazelrc
      - name: Scaffold preset
        run: |
          aspect init "$RUNNER_TEMP/proj" --task:name init-${{ matrix.preset }} --preset='${{ matrix.preset }}' --name=my_project --template-ref=main
      # The template resolves ape 1.0.1 (bazel_env.bzl -> rules_coreutils), which
      # fetches its cosmos binaries from cosmo.zip alone: the GitLab mirror ape's
      # maintainers publish is commented out there and enabled only in ape 1.1.0.
      # cosmo.zip is a single origin and goes down, failing the build at
      # //tools:bazel_env. Try the mirror first; the sha256 pins hold, so it
      # cannot substitute different bytes. The template's .bazelrc already loads
      # bazel/downloader.cfg. Drop this once the template carries the rewrite or
      # resolves ape >= 1.1.0.
      - name: Mirror cosmo.zip downloads
        if: ${{ github.event_name != 'pull_request' || matrix.preset == 'shell' }}
        working-directory: ${{ runner.temp }}/proj
        run: |
          cat >> bazel/downloader.cfg <<'EOF'

          rewrite cosmo\.zip/pub/cosmos/v/([^/]+)/bin/(.+) gitlab.arm.com/api/v4/projects/10212/packages/generic/cosmos.zip/$1/$2
          rewrite cosmo\.zip/pub/cosmos/v/([^/]+)/bin/(.+) cosmo.zip/pub/cosmos/v/$1/bin/$2
          EOF
      - name: Build generated workspace
        if: ${{ github.event_name != 'pull_request' || matrix.preset == 'shell' }}
        working-directory: ${{ runner.temp }}/proj
        run: aspect build --task:name init-${{ matrix.preset }} -- //...
  cache-diff-integration:
    strategy:
      fail-fast: false
      matrix:
        bazel: ["7.4.0", "8.6.0", "9.2.0"]
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - name: Verify cache hits, misses, and exclusions
        run: python3 tools/cache-diff-integration.py --aspect "$(command -v aspect)" --bazel-version "${{ matrix.bazel }}"
  # `BazelTrait.exec_log_event` against a real Bazel. The Rust end-to-end tests
  # drive every task that fires the hook, but against the basil fake, whose log
  # is synthetic `file` entries — no spawns, input sets or runfiles trees. This
  # builds a workspace that produces each of those for real, so the resolver in
  # `private/lib/execlog.axl` and the `kinds` filter are exercised against data
  # Bazel shaped. Matrixed like cache-diff-integration because the compact log's
  # contents are Bazel's to change between releases.
  exec-log-integration:
    strategy:
      fail-fast: false
      matrix:
        # 9.3.0 is what this repo's own .bazelversion pins, so it is the version
        # a change here is most likely to be judged against; the rest span the
        # releases the compact log's contents have differed across.
        bazel: ["7.4.0", "8.6.0", "9.2.0", "9.3.0"]
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - name: Verify exec_log_event against a real execution log
        run: python3 tools/exec-log-integration.py --aspect "$(command -v aspect)" --bazel-version "${{ matrix.bazel }}"
  # `aspect cache diff` probes the remote cache with --experimental_remote_require_cached
  # to list the test targets affected by this commit — running nothing. It needs
  # cache access, which config.axl's Aspect Cloud `--remote` default provides.
  #
  # Baseline = whatever the remote cache already holds (populated by mainline's
  # test-task uploads). We `needs: [pre-build]` (NOT test-task) so the probe reads
  # the pre-PR baseline rather than this run's freshly-uploaded results.
  #
  # The probe forces a fresh remote lookup per action via --nokeep_state_after_build
  # --nouse_action_cache, so it needs no separate or wiped output base.
  cache-diff-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Cache Diff Task
        if: env.ASPECT_HAS_API_TOKEN == 'true'
        run: aspect cache diff --task:name cache-diff-gha
  cache-diff-debug-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Cache Diff Task (ASPECT_DEBUG=1)
        if: env.ASPECT_HAS_API_TOKEN == 'true'
        run: ASPECT_DEBUG=1 aspect cache diff --task:name cache-diff-gha-debug
  # The AXL suite + the CLI/launcher smoke commands were a single Buildkite
  # `axl-tests` step. On GitHub Actions they are split into jobs that run in
  # parallel — `axl-tests` (the ~3min `aspect tests axl` suite), `axl-smoke`
  # (the demo/user/run/flag end-to-end checks) and the sharded `axl-suites`
  # (every `aspect dev test-*` suite) — so none is serialized behind another.
  # All of them build the same dev launcher from THIS commit via the
  # build-dev-launcher composite action; see that action for why the launcher
  # must be built (rather than reused from the prebuilt CLI) and how the
  # host-native binary is probed.
  #
  # `aspect tests axl` asserts (under CI) that it was launched by the just-built,
  # UNSTAMPED launcher: ASPECT_LAUNCHER_VERSION == "0.0.0-dev" and the launcher
  # resolved the CLI via local("target/ci/aspect-cli") (.aspect/axl.axl). The
  # stable `aspect` launcher that setup-aspect / the runner provides is
  # release-stamped, so the dev launcher is built and invoked directly — exactly
  # like Buildkite's `$LAUNCHER`. The composite action exports $LAUNCHER and $CLI
  # into $GITHUB_ENV for the steps below.
  axl-tests:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      # test_large_bes builds examples/large_bes, a second workspace.
      - uses: ./.github/actions/regenerate-machine-bazelrc
      - uses: ./.github/actions/build-dev-launcher
        with:
          task-name: axl-tests-gha-bootstrap
      - name: AXL Tests
        run: |
          echo "--- aspect tests axl"
          "$LAUNCHER" tests axl
  # CLI/launcher end-to-end smoke. Builds its own dev launcher (cheap — a
  # remote-cache hit on the pre-built tree).
  axl-smoke:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      # examples/delivery-scheduler is a second workspace.
      - uses: ./.github/actions/regenerate-machine-bazelrc
      - uses: ./.github/actions/build-dev-launcher
        with:
          task-name: axl-smoke-gha-bootstrap
      - name: CLI/launcher smoke
        run: |
          echo "--- aspect demo template-demo"
          "$LAUNCHER" demo template-demo
          echo "--- aspect user nested user-task"
          "$LAUNCHER" user nested user-task --run_count 5
          echo "--- aspect user user-task-man"
          "$LAUNCHER" user user-task-man
          echo "--- aspect user user-task-added-by-config"
          "$LAUNCHER" user user-task-added-by-config
          echo "--- aspect user user-task-subdir (in crates/aspect-cli)"
          (
            cd crates/aspect-cli
            "$LAUNCHER" user user-task-subdir
          )
          # These four smoke checks assert CLI behavior, not status reporting, so
          # the job's own status is the signal — same reasoning as the delivery
          # digest jobs. Reporting anything is actively misleading here: two of
          # them pass Bazel a flag it must reject, so the PR comment carried two
          # red rows for a passing PR.
          no_status=(
            --github-status-checks:enabled=false
            --github-status-comments:enabled=false
          )
          echo "--- aspect run smoke (//examples/deliverable)"
          "$LAUNCHER" run "${no_status[@]}" //examples/deliverable:py_deliverable
          "$LAUNCHER" run "${no_status[@]}" //examples/deliverable:sh_deliverable -- forwarded-arg
          # $CLI, not $LAUNCHER: the example is its own workspace, with no
          # .aspect/axl.axl pointing the launcher at this commit's CLI.
          echo "--- delivery scheduler example (examples/delivery-scheduler)"
          ./examples/delivery-scheduler/test.sh "$CLI"
          echo "--- aspect help"
          "$LAUNCHER" help
          echo "--- aspect-launcher --version"
          "$LAUNCHER" --version
          echo "--- aspect-cli --version"
          "$CLI" --version
          echo "--- aspect version"
          "$LAUNCHER" version
          # Both must be rejected by the CLI's own validation, before it spawns
          # bazel. Match the message, not just a non-zero exit: an unrecognized
          # *flag* is forwarded to bazel now, so a misspelled flag here would
          # still "fail" — after a full bazel invocation.
          echo "--- invalid --task:id"
          "$LAUNCHER" build --task:id not-a-uuid //... 2>&1 | grep -q "is not a valid UUID" \
            || { echo "ERROR: --task:id should reject a non-UUID"; exit 1; }
          echo "--- invalid --task:name"
          "$LAUNCHER" build --task:name "bad key!" //... 2>&1 | grep -q "contains invalid characters" \
            || { echo "ERROR: --task:name should reject invalid chars"; exit 1; }
          # A flag Bazel rejects has to come back as Bazel's error. This is the
          # shape that used to hang: Bazel exits without opening the build-event
          # pipe, and the reader waited on it forever. `timeout` bounds a
          # regression to a clear failure instead of the whole job budget.
          # Both spellings have to behave identically: the explicit escape
          # hatch, and the bare flag this routes to Bazel on its own.
          # Capture rather than pipe into `grep -q`. Piping discards everything
          # the CLI writes, so any warning these invocations emit — including
          # the withheld-post diagnostic — is invisible, and grep exiting at the
          # match closes the pipe mid-write. Capturing keeps the output in the
          # job log and lets the reader stay to EOF, matching what the delivery
          # jobs already do.
          # `timeout` exits 124 when it kills the command. Check that before the
          # grep: the error text is printed early, so a launcher that prints it
          # and *then* hangs — the regression this guards — still satisfies the
          # grep. Only the exit status distinguishes the two.
          assert_rejects_flag() {
            local label="$1"; shift
            local out code
            out="$(timeout 180 "$LAUNCHER" build "${no_status[@]}" "$@" //... 2>&1)" && code=0 || code=$?
            echo "$out"
            if [ "$code" -eq 124 ]; then
              echo "ERROR: $label hung until the 180s timeout instead of failing"; exit 1
            fi
            grep -q "Unrecognized option" <<<"$out" \
              || { echo "ERROR: $label must fail with Bazel's own error"; exit 1; }
          }
          echo "--- flag rejected by Bazel (--bazel-flag)"
          assert_rejects_flag "a Bazel-rejected flag" --bazel-flag=--definitely_not_a_flag
          echo "--- flag rejected by Bazel (bare)"
          assert_rejects_flag "a bare Bazel-rejected flag" --definitely_not_a_flag
  # Every `aspect dev test-*` suite, split across shards. Each suite pays a few
  # seconds of CLI startup and there are dozens of them, so run serially they
  # outgrew everything else in this workflow. run-axl-suites.sh deals the
  # discovered suites round-robin, so growing the matrix is the only change
  # needed to add a shard.
  axl-suites:
    name: axl-suites (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - uses: ./.github/actions/build-dev-launcher
        with:
          task-name: axl-suites-${{ matrix.shard }}-gha-bootstrap
      - name: AXL suites
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: ./tools/run-axl-suites.sh "$LAUNCHER" "$SHARD"
  # `aspect worktree` end to end: sessions that stop and resume, subagents,
  # moved and re-cloned clones, and the refusals that protect work — the flows
  # the AXL unit suites cannot reach. Its own job rather than part of
  # `axl-smoke`, which is long enough already. Needs only git, jq and the
  # prebuilt CLI from this run: everything happens in a scratch HOME against a
  # local bare remote, with no Bazel and no auth.
  worktree-e2e:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - name: aspect worktree end to end
        # The action puts the prebuilt CLI on PATH as `aspect`.
        run: ./tools/worktree-e2e.sh aspect
  # NOTE: the Buildkite `bazelrc-e2e` step is intentionally NOT ported here. It
  # asserts that bare `bazel` and `aspect` start the SAME Bazel server (identical
  # startup flags, no server thrash). On a GitHub Actions Workflows runner `bazel`
  # resolves to the stable Aspect launcher rather than vanilla bazel, so the
  # bare-bazel-vs-aspect comparison the test depends on can't be reconstructed
  # (and the launcher injects BES/remote-cache config that hangs on flush). It
  # stays a Buildkite-only test on main.
  # Smoke-tests the new test-task flags. Ported from the Buildkite
  # `test-flags-task` step. `--target-pattern-file` is forwarded to Bazel
  # verbatim, so the assertion is just that aspect resolves the file and the run
  # completes. The IDE/BSP step re-runs the same pattern file in the shape the
  # IntelliJ Bazel plugin produces through the tools/bazel wrapper — Bazel's
  # own flag spellings behind `--bazel-flag` — asserting that the composed
  # command line is one Bazel accepts.
  # `--coverage` is exercised against an sh_test rather than a
  # rust_test: toolchains_llvm_bootstrapped 0.5.2 (pinned in MODULE.bazel) ships
  # without libclang_rt.profile.a, so any rust_test under --collect_code_coverage
  # fails CppLink (upstream hermeticbuild/hermetic-llvm#318, fixed in #468 — not
  # in 0.5.2 yet). sh_test has no coverage instrumentation so this exercises flag
  # plumbing + the "report not found" warning path rather than an LCOV payload.
  test-flags-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Test Task — new flags
        run: |
          echo "--- aspect test --target-pattern-file"
          PATTERNS=$(mktemp)
          echo "# smoke: targets forwarded via --target_pattern_file" > "$PATTERNS"
          echo "//examples/test_states:always_pass" >> "$PATTERNS"
          aspect test --task:name test-gha-target-pattern-file --target-pattern-file="$PATTERNS"

          echo "--- IDE/BSP shape — bazel flags typed directly, and one still wrapped"
          # --tool_tag stays wrapped on purpose: --bazel-flag= is still supported
          # and this is the only place CI exercises that spelling.
          aspect build --task:name test-gha-ide-target-pattern-file \
            --target_pattern_file="$PATTERNS" \
            --bazel-flag=--tool_tag=bazelbsp:3.2.0
          rm -f "$PATTERNS"

          echo "--- bazel flags in Bazel's own spellings, both slots"
          aspect --output_base "$RUNNER_TEMP/aspect-space-form-ob" \
            build --task:name test-gha-bazel-flag-spellings \
            -c opt --jobs 8 --nobuild //examples/test_states:always_pass

          echo "--- aspect test --coverage (+ --coverage-report + --coverage-tool)"
          REPORT=$(mktemp)
          aspect test --task:name test-gha-coverage \
            --coverage \
            --coverage-report="$REPORT" \
            --coverage-tool=cat --coverage-tool-arg='{report}' \
            //examples/test_states:always_pass
          rm -f "$REPORT"
  # Delivery against Aspect Cloud: the delivery API (the default state backend)
  # and Aspect Cloud's remote cache for change detection. A fork PR gets no
  # secrets, so each job's delivery step is skipped there.
  delivery-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Delivery Task
        if: env.ASPECT_HAS_API_TOKEN == 'true'
        # --force-target re-delivers every run so the manifest always
        # carries at least one `ok` outcome to exercise the per-target
        # enrichment hook in //.aspect/config.axl.
        # --warn-unresolved-digest: this deliverable set includes py_deliverable,
        # a stamped py_binary whose PyWriteBuildData action is uncacheable and so
        # never resolves a digest — a known, tolerated missing digest here, so
        # keep it a warning rather than the default hard failure.
        run: aspect delivery --task:name delivery-gha --warn-not-runnable --warn-unresolved-digest --force-target=//examples/deliverable:deliverable_with_digest
  delivery-debug-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Delivery Task (ASPECT_DEBUG=1)
        if: env.ASPECT_HAS_API_TOKEN == 'true'
        # --warn-unresolved-digest for the same reason as delivery-gha: the
        # deliverable set includes the stamped, uncacheable py_deliverable.
        run: ASPECT_DEBUG=1 aspect delivery --task:name delivery-gha-debug --warn-unresolved-digest --force-target=//examples/deliverable:deliverable_with_digest
  # Regression guard for the silent-warn bug where an unhashable deliverable
  # passed green and was never delivered. //examples/deliverable:py_deliverable
  # is a stamped py_binary whose PyWriteBuildData action is uncacheable, so it
  # never resolves a change-detection digest. Delivery must HARD-FAIL by default
  # — naming the culprit target + action and the fix — and DOWNGRADE to a
  # warning (exit 0) under --warn-unresolved-digest. (The default delivery query
  # `attr(tags, deliverable, //...)` from config.axl takes precedence over
  # positional targets, so we assert against this in-tree deliverable rather
  # than a bespoke target the query would skip.)
  delivery-uncacheable-digest-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Delivery unresolvable-digest must hard-fail
        if: env.ASPECT_HAS_API_TOKEN == 'true'
        run: |
          set -uo pipefail
          # This job deliberately makes delivery fail, so suppress its GitHub
          # check run — a red "aspect / delivery-uncacheable" check on the PR
          # would be noise, not a real signal.
          common="--track-state=false --mode=always --dry-run --github-status-checks:enabled=false"

          echo "== Expect HARD FAILURE (default: no --warn-unresolved-digest) =="
          out="$(aspect delivery --task:name delivery-uncacheable $common 2>&1)" && code=0 || code=$?
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::delivery succeeded but must hard-fail when a digest can't be resolved"; exit 1
          fi
          grep -q "py_deliverable" <<<"$out" \
            || { echo "::error::failure did not name the uncacheable target py_deliverable"; exit 1; }
          grep -q "PyWriteBuildData" <<<"$out" \
            || { echo "::error::failure did not name the uncacheable action PyWriteBuildData"; exit 1; }
          grep -Eq "no-remote|local" <<<"$out" \
            || { echo "::error::failure did not surface the no-remote / local remediation"; exit 1; }

          echo "== Expect WARNING downgrade (exit 0) with --warn-unresolved-digest =="
          aspect delivery --task:name delivery-uncacheable-warn --warn-unresolved-digest $common
  # Regression guard for the no-remote-exec deliverable whose digest resolved on
  # the first run and silently vanished on every later one. Bazel propagates a
  # target's tags into the actions an aspect registers on it, so
  # //examples/deliverable:no_remote_exec_deliverable yields a DeliveryHash probe
  # that may run LOCALLY. A probe that runs successfully lands in Bazel's local
  # action cache, so the next checksum phase skips the spawn, issues no
  # GetActionResult, and resolves no digest — dropping the target from delivery.
  # Catching that takes TWO consecutive runs sharing one output base (the first
  # always passes), which is why both run in a single job on one runner. No
  # --warn-unresolved-digest here: an unresolved digest must hard-fail.
  delivery-no-remote-exec-digest-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: no-remote-exec deliverable must resolve a digest on every run
        if: env.ASPECT_HAS_API_TOKEN == 'true'
        run: |
          set -uo pipefail
          # --query scopes this to the fixture: config.axl's default delivery
          # query takes precedence over positional targets. Two sequential runs
          # under one --task:name would post duplicate check-runs, so suppress
          # them — the job's own status is the signal.
          common="--track-state=false --mode=always --dry-run --github-status-checks:enabled=false --query=//examples/deliverable:no_remote_exec_deliverable"

          for run in 1 2; do
            echo "== Run $run: expect a resolved digest =="
            out="$(aspect delivery --task:name delivery-no-remote-exec $common 2>&1)" && code=0 || code=$?
            echo "$out"
            if [ "$code" -ne 0 ]; then
              echo "::error::run $run failed (exit $code): a no-remote-exec deliverable must resolve a change-detection digest"
              exit 1
            fi
            # Exit 0 alone is not enough — assert the digest actually resolved
            # rather than the phase being skipped for want of a remote cache.
            grep -q "Resolved digests for all" <<<"$out" \
              || { echo "::error::run $run resolved no digest for no_remote_exec_deliverable (local action cache likely served the DeliveryHash probe)"; exit 1; }
          done
  # Regression guard for the dry-run that performed the full stamped release
  # build of every pending target and then dispatched nothing. --dry-run must
  # skip phase 3; --dry-run=build must bring it back. --force-target guarantees
  # a pending target on a steady-state run, so "no phase-3 build" can't pass
  # trivially by there being nothing left to deliver. Both runs suppress their
  # check runs — the job's own status is the signal.
  delivery-dry-run-build-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: --dry-run skips the delivery build, --dry-run=build restores it
        if: env.ASPECT_HAS_API_TOKEN == 'true'
        run: |
          set -uo pipefail
          # --warn-not-runnable / --warn-unresolved-digest for the same reasons
          # as delivery-gha: this deliverable set intentionally contains a
          # non-runnable target and the stamped, uncacheable py_deliverable.
          common="--warn-not-runnable --warn-unresolved-digest --github-status-checks:enabled=false --force-target=//examples/deliverable:deliverable_with_digest"
          preview_common="--dry-run $common"
          build_common="--dry-run=build $common"

          echo "== --dry-run: expect NO phase-3 build =="
          out="$(aspect delivery --task:name delivery-dry-run $preview_common 2>&1)" && code=0 || code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::dry-run delivery failed (exit $code)"; exit 1
          fi
          grep -q "Skipping the delivery build" <<<"$out" \
            || { echo "::error::dry-run did not report skipping the delivery build"; exit 1; }
          if grep -q "Delivery build took" <<<"$out"; then
            echo "::error::dry-run ran the phase-3 delivery build; it must be skipped unless --dry-run=build"; exit 1
          fi

          echo "== --dry-run=build: expect the phase-3 build =="
          out="$(aspect delivery --task:name delivery-dry-run-build $build_common 2>&1)" && code=0 || code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::--dry-run=build delivery failed (exit $code)"; exit 1
          fi
          grep -q "Delivery build took" <<<"$out" \
            || { echo "::error::--dry-run=build did not run the phase-3 delivery build"; exit 1; }
          if grep -q "Skipping the delivery build" <<<"$out"; then
            echo "::error::--dry-run=build reported skipping the delivery build"; exit 1
          fi
  # Regression guard for the reap loop that blocked on a running deliverable:
  # the task sent no updates until it exited, so the check-run heartbeat those
  # updates carry stopped and the orphan sweep closed the check as DISCONNECTED
  # while the target still ran. slow_deliverable runs for 15s and fails unless
  # a task update (stamped by //.aspect/config.axl) lands meanwhile.
  delivery-heartbeat-task:
    runs-on: ubuntu-latest
    needs: [pre-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-prebuilt-aspect-cli
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # v2026.45.0
        with:
          launcher-install: false
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Delivery keeps sending task updates while a target runs
        if: env.ASPECT_HAS_API_TOKEN == 'true'
        env:
          ASPECT_TEST_TASK_UPDATE_STAMP: ${{ runner.temp }}/delivery-task-update-stamp
        run: aspect delivery --task:name delivery-heartbeat --track-state=false --mode=always --github-status-checks:enabled=false --query=//examples/deliverable:slow_deliverable
  # The one status check the `main` ruleset requires. Add new jobs to `needs`;
  # `if: always()` lets it report red when a dependency fails or is cancelled.
  # The opt-in Workflows-runner jobs may also be skipped.
  ci-ok:
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    needs:
      - wrapper-test
      - pre-build
      - dispatch-workflows-runners
      - buildifier-task
      - buildifier-debug-task
      - format-task
      - format-debug-task
      - format-repeat-task
      - gazelle-task
      - gazelle-debug-task
      - gazelle-from-source-task
      - gazelle-from-source-debug-task
      - lint-task
      - lint-debug-task
      - build-task
      - test-task
      - init-preset
      - cache-diff-integration
      - exec-log-integration
      - cache-diff-task
      - cache-diff-debug-task
      - delivery-task
      - delivery-debug-task
      - delivery-uncacheable-digest-task
      - delivery-no-remote-exec-digest-task
      - delivery-dry-run-build-task
      - delivery-heartbeat-task
      - axl-tests
      - axl-smoke
      - axl-suites
      - worktree-e2e
      - test-flags-task
    steps:
      - name: Every CI job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<<"$RESULTS" | sort
          failed=$(jq -r '
            ["dispatch-workflows-runners"] as $optional
            | to_entries[]
            | select(.value.result != "success")
            | select(.value.result != "skipped" or (.key | IN($optional[]) | not))
            | .key' <<<"$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error::CI jobs that did not succeed: $(tr '\n' ' ' <<<"$failed")"
            exit 1
          fi
