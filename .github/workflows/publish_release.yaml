name: Publish Release
on:
  workflow_call:
    inputs:
      tag_name:
        description: 'The tag name for the release (e.g., v2024.1.0)'
        required: true
        type: string
  push:
    tags:
      - 'v202[0-9].[0-9]+.[0-9]+'
      - 'v202[0-9].[0-9]+.[0-9]+-pre'
env:
  TAG: ${{ inputs.tag_name || github.ref_name }}
  # The tag alone decides, so the release flag and the notes can't disagree.
  PRERELEASE: ${{ endsWith(inputs.tag_name || github.ref_name, '-pre') }}
permissions:
  id-token: write
  attestations: write
  contents: write
jobs:
  build_release_artifacts:
    uses: ./.github/workflows/build_release_artifacts.yaml
    with:
      release: true
    secrets: inherit
  release:
    name: Build MacOS and Linux release artifacts
    runs-on: ubuntu-latest
    needs: build_release_artifacts
    steps:
      - uses: actions/checkout@v6
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Display structure of downloaded files
        run: ls -R
      - name: Calculate shasum
        run: shasum -a 256 assets/* > sha256
      - name: Prepare workspace snippet
        run: .github/workflows/install_snippet.sh > release_notes.txt
      - name: Create GitHub draft release and upload artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ env.PRERELEASE }}
          # Pre-releases must never become the "latest" release that
          # install.aspect.build and unpinned launchers resolve.
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}
          # Use GH feature to populate the changelog automatically
          generate_release_notes: true
          body_path: release_notes.txt
          files: |
            assets/*
            sha256
